<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow — Bible Cross-Reference Visualization</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="header-row">
        <div id="header-title">
          <h1>Rainbow Reference</h1>
          <p class="subtitle">The world's first hyperlinked Text — The Bible</p>
        </div>
        <div id="controls">
          <button id="zoom-fit" class="canvas-btn">Fit</button>
          <button id="zoom-ot" class="preset-btn">Old Testament</button>
          <button id="zoom-nt" class="preset-btn">New Testament</button>
        </div>
      </div>
      <div class="gradient-bar"></div>
    </div>
    <div id="canvas-container">
      <canvas id="main-canvas"></canvas>
      <div id="canvas-controls-left">
        <button id="btn-shuffle" class="canvas-btn">Shuffle</button>
      </div>
      <div id="side-panel" class="hidden">
        <button id="side-panel-close">&times;</button>
        <div id="side-panel-content"></div>
      </div>
      <div id="canvas-controls-right">
        <input type="text" id="book-search" placeholder="Search book..." />
        <div id="view-toggle">
          <button id="view-arcs" class="active">Arcs</button>
          <button id="view-heatmap">Heatmap</button>
        </div>
      </div>
    </div>
    <div id="category-filters"></div>
    <div id="footer">
      <div id="footer-text">
        <span>Inspired by <a href="https://www.chrisharrison.net/index.php/visualizations/BibleViz" target="_blank">Chris Harrison</a>. Made by <a href="https://www.jessedestroys.com" target="_blank">www.jessedestroys.com</a> · v0.1.0</span>
        <span id="footer-stats"></span>
      </div>
    </div>
    <div id="tooltip" class="hidden"></div>
    <div id="shuffle-overlay" class="hidden">
      <canvas id="shuffle-canvas"></canvas>
      <div id="shuffle-content">
        <p id="shuffle-verse-1" class="shuffle-ref"></p>
        <div id="shuffle-arrow">↔</div>
        <p id="shuffle-verse-2" class="shuffle-ref"></p>
        <button id="btn-shuffle-again" class="canvas-btn">Shuffle again</button>
        <button id="btn-shuffle-exit" class="canvas-btn">Exit</button>
      </div>
    </div>
    <div id="loading">
      <div id="loading-text">Loading cross-references...</div>
      <div id="loading-bar"><div id="loading-progress"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
