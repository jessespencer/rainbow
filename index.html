<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow — Bible Cross-Reference Visualization</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="controls">
      <div id="category-filters"></div>
      <div id="view-toggle">
        <button id="view-arcs" class="active">Arcs</button>
        <button id="view-heatmap">Heatmap</button>
      </div>
      <input type="text" id="book-search" placeholder="Search book..." />
      <div id="ref-count-display">
        <span id="ref-count">0</span> references
      </div>
    </div>
    <div id="canvas-container">
      <canvas id="main-canvas"></canvas>
    </div>
    <div id="tooltip" class="hidden"></div>
    <div id="side-panel" class="hidden">
      <button id="side-panel-close">&times;</button>
      <div id="side-panel-content"></div>
    </div>
    <div id="loading">
      <div id="loading-text">Loading cross-references...</div>
      <div id="loading-bar"><div id="loading-progress"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
