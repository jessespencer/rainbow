name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:atlas
      - run: pnpm build:lineage
      - run: pnpm test:byheart
      - run: pnpm build:byheart
      # Served at /bible/: each app in its own folder, and the root forwards to Atlas.
      - name: Assemble Pages output
        run: |
          mkdir -p dist/atlas dist/lineage dist/byheart
          cp -r apps/atlas/dist/. dist/atlas/
          cp -r apps/lineage/dist/. dist/lineage/
          cp -r apps/byheart/dist/. dist/byheart/
          cp pages/index.html dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
