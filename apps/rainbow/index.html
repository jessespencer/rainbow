<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow — Bible Cross-Reference Visualization</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- header injected by bible-ui createHeader() -->
    <div id="canvas-container">
      <canvas id="main-canvas"></canvas>
      <div id="universe-container" class="hidden"></div>
      <div id="universe-panel" class="hidden">
        <div class="u-head">Layers</div>

        <div class="u-row" data-layer="edges" role="switch" aria-checked="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M18 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M7.5 16.5l9 -9"/>
          </svg>
          <span class="u-label">Edges</span><span class="u-switch"></span>
        </div>
        <div class="u-row" data-layer="bridges" role="switch" aria-checked="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 19m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M18 5m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M6 16v-6a3 3 0 0 1 3 -3h6"/>
          </svg>
          <span class="u-label">Bridges <em>OT↔NT</em></span><span class="u-switch"></span>
        </div>
        <div class="u-row active" data-layer="labels" role="switch" aria-checked="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7.5 7.5m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M3 6v5.172a2 2 0 0 0 .586 1.414l7.71 7.71a2.41 2.41 0 0 0 3.408 0l5.592 -5.592a2.41 2.41 0 0 0 0 -3.408l-7.71 -7.71a2 2 0 0 0 -1.414 -.586h-5.172a3 3 0 0 0 -3 3z"/>
          </svg>
          <span class="u-label">Labels</span><span class="u-switch on"></span>
        </div>

        <div class="u-divider"></div>
        <div class="u-sub">Color</div>
        <div class="u-seg" id="up-color">
          <button data-mode="category" class="on">Theme</button>
          <button data-mode="testament">OT/NT</button>
          <button data-mode="heat">Heat</button>
          <button data-mode="book">Book</button>
        </div>

        <div class="u-sub" style="margin-top:14px">Node size</div>
        <div class="u-seg" id="up-size">
          <button data-mode="uniform" class="on">Uniform</button>
          <button data-mode="connections">Connections</button>
        </div>
      </div>
      <button id="up-fit" class="hidden u-fit-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8v-2a2 2 0 0 1 2 -2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M16 20h2a2 2 0 0 0 2 -2v-2"/>
        </svg>
        Fit
      </button>
      <div id="canvas-controls-left">
        <button id="btn-shuffle" class="canvas-btn">Shuffle</button>
      </div>
      <div id="side-panel" class="hidden">
        <button id="side-panel-close">&times;</button>
        <div id="side-panel-content"></div>
      </div>
      <div id="canvas-controls-right">
        <button id="clear-filters" class="canvas-btn">✕ Clear</button>
        <input type="text" id="book-search" placeholder="Search book..." />
        <div id="view-toggle">
          <button id="view-arcs" class="active">Arcs</button>
          <button id="view-heatmap">Heatmap</button>
          <button id="view-universe">Universe</button>
        </div>
      </div>
    </div>
    <div id="category-filters"></div>
    <div id="footer">
      <div id="footer-text">
        <span>Inspired by <a href="https://www.chrisharrison.net/index.php/visualizations/BibleViz" target="_blank">Chris Harrison</a>. Made by <a href="https://www.jessedestroys.com" target="_blank">jessedestroys.com</a> · v1.0.0</span>
        <span id="footer-stats"></span>
      </div>
    </div>
    <div id="tooltip" class="hidden"></div>
    <div id="shuffle-overlay" class="hidden">
      <canvas id="shuffle-canvas"></canvas>
      <div id="shuffle-content">
        <p id="shuffle-verse-1" class="shuffle-ref"></p>
        <div id="shuffle-arrow">↔</div>
        <p id="shuffle-verse-2" class="shuffle-ref"></p>
        <button id="btn-shuffle-again" class="canvas-btn">Shuffle again</button>
        <button id="btn-shuffle-exit" class="canvas-btn">Exit</button>
      </div>
    </div>
    <div id="loading">
      <div id="loading-text">Loading cross-references...</div>
      <div id="loading-bar"><div id="loading-progress"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
